{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="error-box">
        <h2>🚫 {{ error_title }}</h2>
        <p style="margin-top: 0.5rem; font-weight: 600; color: #fca5a5;">
            Reason: {{ error_type }}
        </p>
        <p style="margin-top: 0.75rem;">
            {{ error_message }}
        </p>
    </div>

    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
        💡 <strong>How to fix:</strong> {{ suggestion }}
    </p>

    <a href="{{ url_for('index') }}" class="btn">&larr; Return to Upload Page</a>
</div>
{% endblock %}
